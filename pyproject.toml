[project]
name = "lod2-citygml"
version = "0.1.0"
description = "CLI tool to reconstruct LOD2 building models from footprints, orthophoto, DSM, and DTM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pyyaml>=6.0.2",
  "numpy>=1.26",
  "shapely>=2.0",
  "rasterio>=1.3",
  "geopandas>=0.14",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "opencv-python>=4.9",
  "scikit-learn>=1.4",
  "lxml>=5.2",
  "geoai-py>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
lod2-citygml = "lod2_citygml.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
